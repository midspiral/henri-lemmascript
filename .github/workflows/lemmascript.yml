name: LemmaScript

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    uses: midspiral/LemmaScript/.github/workflows/verify.yml@main
    with:
      backend: dafny
      node-version: '22'

  # Typecheck the runnable agent and run the runtime smoke witnesses.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
